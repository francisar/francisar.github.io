observation_id: "MO-TRAFFIC-001"

hypotheses:
  - id: H1
    statement: "明确的人行横道优先规则和事故责任预期，使司机在行人准备过街时选择减速或停车。"
    mechanism: "司机即使看不到红绿灯，也能通过斑马线、交通标志和既有驾驶规则判断行人具有优先权；不让行的潜在罚款、事故责任和保险成本高于短暂停车成本。"
    predictions:
      - "无灯人行横道应有清晰的标线、标志或其他能够传递优先权的道路信息。"
      - "车辆在没有明显摄像头的地点也会维持相近的让行行为。"
      - "司机和行人对‘何时必须让行’的口头描述大体一致。"
      - "交通违法和事故责任规则能够解释司机为何在不确定时倾向于先停车。"
    evidence_needed:
      - "澳门现行交通法规、人行横道标线和车辆让行义务。"
      - "不让行的罚则、事故责任、保险影响和执法案例。"
      - "澳门驾驶培训或官方道路安全宣传材料。"
      - "不同类型无灯人行横道的现场行为计数。"
    falsifiers:
      - "官方规则并未赋予行人相应优先权，且不让行几乎没有责任或处罚。"
      - "车辆只在行人已经踏入横道后才停车，无法观察到提前让行。"
      - "司机对规则的理解高度分散，行为也没有稳定模式。"
    confidence_before_research: medium

  - id: H2
    statement: "道路几何形态和低速环境替代了部分红绿灯功能，使车辆更容易发现行人并安全让行。"
    mechanism: "狭窄道路、路口位置、短过街距离、照明、路缘设计、视线条件和较低车速，降低了车辆停车成本和碰撞风险，从而使无灯过街仍能保持秩序。"
    predictions:
      - "无灯人行横道主要位于低速、狭窄、视线较好或车辆必须自然减速的路段。"
      - "道路宽度、车辆速度、停车视距和照明条件比摄像头可见度更能预测让行率。"
      - "在宽阔、快速、视线受阻的道路上，可能需要信号灯、抬高式人行横道或其他设施。"
      - "移除标线、照明、路缘收窄或其他减速设计后，让行率会下降。"
    evidence_needed:
      - "人行横道位置、道路宽度、限速、车道数量、照明和路缘设计资料。"
      - "不同道路环境下的车辆速度、停车距离和让行率。"
      - "澳门交通部门关于人行横道设置和道路工程标准的文件。"
    falsifiers:
      - "在高速、宽路、视线差的路段仍然出现同等让行率，而道路几何差异不能解释行为。"
      - "控制车辆速度和道路设计后，摄像头或执法可见度才是最强预测因素。"
    confidence_before_research: medium

  - id: H3
    statement: "司机与行人之间形成了可重复的行为规范和即时协调，即使缺少可见信号控制也能完成过街。"
    mechanism: "行人通过站位、目光和迈步表达过街意图，司机通过减速、停车和让出车头表达承认；长期重复的互动形成共同预期，降低了每次过街的协商成本。"
    predictions:
      - "司机和行人经常通过目光、手势、车辆轻微减速或试探性迈步完成确认。"
      - "在没有明显执法设施的地点，行为仍会在不同车辆和行人之间重复出现。"
      - "后车通常接受前车停车让行，而不是频繁鸣笛或绕行。"
      - "当行人犹豫、司机无法确认意图或道路拥堵时，秩序更容易失效。"
    evidence_needed:
      - "对司机、行人信号和后车反应的连续视频或定时观察。"
      - "司机和行人对礼让预期、信任和冲突经历的访谈。"
      - "不同街区、时间和交通密度下的重复观察。"
    falsifiers:
      - "行为只在有警员、摄像头或高处罚风险的地点出现。"
      - "司机与行人之间很少有可观察的相互确认，且让行主要由道路设施触发。"
      - "后车普遍反对停车让行，导致前车难以持续执行。"
    confidence_before_research: low

  - id: H4
    statement: "职业司机、车队管理和保险激励提高了车辆让行率，街头秩序部分由组织化运营者生产。"
    mechanism: "出租车、公交车、旅游巴士和其他职业车辆受到驾驶培训、企业制度、乘客评价、事故成本和保险约束，因此比完全匿名的私人驾驶更有动力稳定让行。"
    predictions:
      - "出租车、公交车和企业车辆的减速停车率与私家车存在可识别差异。"
      - "职业司机能更准确描述人行横道规则和违规后果。"
      - "车队或平台存在培训、投诉、事故考核或保险差异。"
      - "在游客多、出租车多的区域，整体让行率可能受职业车辆比例影响。"
    evidence_needed:
      - "按车辆类型记录让行、未让行、停车距离和冲突事件。"
      - "出租车、公交和旅游运输企业的培训、投诉、事故和保险制度。"
      - "司机访谈及交通管理部门的职业驾驶监管材料。"
    falsifiers:
      - "控制道路、速度和行人条件后，各类车辆的行为没有差异。"
      - "职业司机没有额外培训、监管或事故成本，且组织因素不能预测让行行为。"
    confidence_before_research: low

  - id: H5
    statement: "秩序并非没有控制，而是存在观察者不易看到的执法、事故追责和社会监督。"
    mechanism: "隐蔽摄像头、远距离摄像头、移动巡逻、车牌识别、投诉记录、行车记录仪和事故责任追究，使司机感知到不让行仍可能被发现，即使现场没有明显设备。"
    predictions:
      - "无灯人行横道附近可能存在观察范围外、外观不明显或并非专门用于过街执法的设备。"
      - "司机对摄像头和处罚的判断来自日常经验、事故案例、保险和社会传播，而不只来自现场可见设施。"
      - "有投诉、事故或执法记录的路段让行率更高，或在特定时段更稳定。"
      - "一旦确认没有任何监测或追责机制，司机让行行为会明显下降。"
    evidence_needed:
      - "澳门交通摄像头、电子执法、巡逻和车牌识别设施的公开资料。"
      - "人行横道相关违法、事故、投诉和处罚记录。"
      - "司机对被发现概率和违法后果的访谈或问卷。"
      - "同一路段有无执法设施、不同时间段的行为对照。"
    falsifiers:
      - "官方和现场资料均显示不存在相关监测、巡逻、投诉或事故追责机制。"
      - "在确认没有监测的偏远或低流量路段，让行率仍与高监督路段相同。"
      - "司机明确表示其行为与处罚、事故或他人监督无关，且观察数据支持这一点。"
    confidence_before_research: low
