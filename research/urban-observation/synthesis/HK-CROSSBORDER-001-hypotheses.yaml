observation_id: "HK-CROSSBORDER-001"

hypotheses:
  - id: H1
    statement: "两地牌车首先是行政协调和特别许可制度的产物，跨境需求在制度建立后推动了其扩张。"
    mechanism: "两地政府或口岸管理机构先建立车辆、车牌、驾驶人和通行许可之间的接口，再允许特定企业或车辆类型直接跨境。"
    predictions:
      - "在车辆数量明显增加之前，可以找到明确的法规、试点文件、审批办法或口岸协定。"
      - "制度早期会限定车辆用途、企业资格、通行口岸、配额或驾驶人范围。"
      - "车辆登记、驾驶证、保险和检验要求会随着政策文件分阶段补齐。"
      - "车辆数量或适用范围的变化会与政策修订和配额调整同步。"
    evidence_needed:
      - "香港、广东及中央部门关于跨境车辆、车牌和驾驶资格的法规与公告。"
      - "早期试点、审批、配额、通关和车辆统计资料。"
      - "车辆登记文件、跨境许可证和驾驶人管理规则的历史版本。"
    falsifiers:
      - "在任何正式许可或协调文件之前，已有大量同类车辆稳定跨境运行。"
      - "找不到明确的制度节点，且车辆数量主要随其他因素变化。"
    confidence_before_research: medium
    confidence_after_research: high_for_administrative_interface_medium_for_first_origin

  - id: H2
    statement: "两地牌车是跨境贸易、人员往来和高频运输需求增长后形成的需求倒逼结果。"
    mechanism: "企业和乘客需要减少换车、转运和等待时间，运输主体的成本压力促使管理机构提供直接跨境的车辆安排。"
    predictions:
      - "跨境贸易额、跨境客流或企业往来在制度出现前已经出现明显增长。"
      - "早期获准车辆集中在高频率、时间敏感或货值较高的运输场景。"
      - "行业组织、企业或口岸运营者曾提出减少换车和转运成本的诉求。"
      - "制度扩容会跟随跨境运输需求，而不是只跟随行政区划或车牌格式变化。"
    evidence_needed:
      - "制度出现前后的贸易、客流、货运、机场接送和口岸通行数据。"
      - "企业、行业协会、运输商和乘客关于换车成本与通关效率的材料。"
      - "早期两地牌车辆的行业、用途和车主结构。"
    falsifiers:
      - "官方记录显示制度早已建立，而当时跨境运输需求仍然很小。"
      - "最早使用者并非高频跨境运输主体，且没有可观察的成本压力。"
    confidence_before_research: medium
    confidence_after_research: medium

  - id: H3
    statement: "关键时间节点主要由口岸、桥隧、机场或道路基础设施的建成和开放决定，车辆制度是基础设施可用后的配套安排。"
    mechanism: "当道路连接、口岸查验和交通组织具备直接通行条件后，车辆跨境的技术和行政成本下降，双牌及相关许可才有实际使用价值。"
    predictions:
      - "两地牌车制度的首次出现或显著扩容与特定口岸、桥隧或机场交通设施的启用时间接近。"
      - "制度最初集中在能够直接连接的特定路线和口岸，之后随基础设施扩展。"
      - "在基础设施尚未具备时，即使有跨境需求，车辆直接通行的使用率也较低。"
      - "机场、口岸和桥隧附近的两地牌车密度高于普通城市街道。"
    evidence_needed:
      - "口岸、桥隧、机场和道路设施的建设及启用时间线。"
      - "不同口岸的车辆通行量、许可范围和开放时间。"
      - "制度在不同通道之间的扩散顺序。"
    falsifiers:
      - "两地牌车制度在相关基础设施启用多年以前已经普遍存在。"
      - "车辆数量和路线扩张与基础设施时间线没有关系。"
    confidence_before_research: low
    confidence_after_research: medium_for_later_expansion_low_for_first_origin

  - id: H4
    statement: "左舵与右舵并存主要是香港和广东既有车辆、道路及登记标准的历史遗留，双牌制度只是给这种差异增加了跨境通行接口。"
    mechanism: "两地原本拥有不同的道路行驶方向、车辆来源和登记标准；跨境许可允许部分车辆带着原属地标准进入另一地，而不必把整个车队改造成单一标准。"
    predictions:
      - "左舵和右舵车辆在双牌制度出现之前就分别存在于两地市场。"
      - "跨境许可规则会说明哪些车辆标准可以被承认，而不一定要求所有车辆统一方向盘位置。"
      - "左舵与右舵的分布更接近车辆来源、车型和行业用途，而不是单纯由车牌决定。"
      - "车辆检验、灯光、后视镜、车牌和驾驶人要求可能分别处理，而不是通过改装方向盘解决。"
    evidence_needed:
      - "两地道路行驶方向、车辆登记、进口和检验标准的历史资料。"
      - "双牌车辆对方向盘位置、车辆来源和改装的具体规定。"
      - "不同车型、行业和属地车辆中左舵与右舵的分布。"
    falsifiers:
      - "跨境许可明确规定车辆必须采用某一方向盘位置，且这一规定决定了车辆准入。"
      - "左舵和右舵车辆只在双牌制度出现后才出现，且此前两地市场没有这种差异。"
    confidence_before_research: medium
    confidence_after_research: medium

  - id: H5
    statement: "两地牌车并非因机场而出现；机场只是跨境客运和商务接送使其更容易被观察到的场所。"
    mechanism: "机场连接跨境旅客、企业和接送服务，直接通行的车辆在接客区、停车场或货运区集中出现，从而提高可见度。"
    predictions:
      - "在机场之外的口岸、物流园区、企业园区和跨境接驳点，也能观察到类似车辆。"
      - "两地牌车的出现时间早于机场观察，机场只是后续的重要使用场景。"
      - "机场附近车辆主要承担旅客接送、商务接待或机场货运，而其他地点的车辆用途不同。"
      - "车辆出现频率与机场客流、航班、商务活动或跨境接送需求相关。"
    evidence_needed:
      - "机场、口岸、物流园区和城市道路的车辆观察或通行数据。"
      - "机场接送企业的车辆用途、路线和许可要求。"
      - "两地牌制度出现时间与机场客流增长时间的对照。"
    falsifiers:
      - "最早的制度文件明确把机场接驳作为制度起点，且其他场景后来才出现。"
      - "机场之外几乎没有同类车辆，且制度资格只服务机场接送。"
