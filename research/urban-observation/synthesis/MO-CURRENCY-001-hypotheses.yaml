observation_id: "MO-CURRENCY-001"

hypotheses:
  - id: H1
    statement: "澳门元之所以保留，主要因为本地货币承担法定计价、公共收费、财政管理、金融监管和制度协调功能；港币的广泛流通不能替代这些公共职能。"
    mechanism: "即使私人交易可以使用港币，政府仍需要一个本地记账单位来计价工资、税费、预算、公共服务和法律合同；保留澳门元也使本地机构维持货币发行与金融治理接口。"
    predictions:
      - "政府收费、公共部门工资、法律合同或本地银行业务中，澳门元仍具有明确的制度优先地位。"
      - "澳门元的发行、兑换和金融监管由本地公共机构持续维护，而不是仅由商户习惯维持。"
      - "即使部分商户更愿意收港币，公共部门和金融机构仍不会把港币完全替代澳门元作为唯一计价单位。"
      - "如果取消澳门元，财政、工资、合同、账户和监管系统会出现需要统一处理的转换成本。"
    evidence_needed:
      - "澳门元的法定货币地位、发行机构、货币制度和公共收费规定。"
      - "政府预算、公共部门工资、税费、罚款和公共服务的计价货币。"
      - "银行账户、贷款、支付清算和金融监管中澳门元与港币的制度安排。"
      - "取消或改变本地货币后的法律、财政和金融系统转换评估。"
    falsifiers:
      - "澳门绝大多数公共收费、工资、合同和银行业务事实上都以港币计价，澳门元只保留象征性用途。"
      - "澳门元没有独立的发行、监管或公共记账功能，完全由港币网络替代。"
      - "取消澳门元不会给财政、金融和公共管理系统带来明显转换成本。"
    confidence_before_research: medium

  - id: H2
    statement: "稳定的汇率安排和较低的兑换摩擦，使澳门元与港币在日常交易中高度可替代；正因为可以借助港币的稳定和网络，澳门不必通过正式港币化来获得同样的便利。"
    mechanism: "如果两种货币之间的汇率长期稳定、兑换容易且风险可控，澳门可以保留本地货币单位，同时允许港币承担部分交易和资产功能；正式改用港币的边际收益有限，却会产生制度切换成本。"
    predictions:
      - "港币与澳门元之间的兑换成本、汇率波动和商户实际换算差异较低。"
      - "商户和居民能够在两种货币之间灵活转换，而不需要为每次交易承担显著的汇率风险。"
      - "港币的使用比例在跨境消费、旅游和金融资产中较高，但澳门元仍可稳定完成本地结算。"
      - "在汇率、兑换便利或金融稳定性发生变化时，居民和商户的货币选择会明显改变。"
    evidence_needed:
      - "澳门元与港币的汇率制度、兑换承诺、储备安排和历史波动。"
      - "银行、兑换店、ATM和商户的实际兑换价差、手续费和找零规则。"
      - "居民与企业持有两种货币的余额、期限结构和交易用途。"
      - "汇率或兑换成本变化时期的货币使用、存款和资产配置变化。"
    falsifiers:
      - "两种货币之间存在持续且显著的汇率风险或兑换摩擦，双货币使用并不便宜。"
      - "港币与澳门元的金融功能和支付便利差异很大，不能被视为高度替代。"
      - "即使汇率和兑换条件长期稳定，澳门仍因其他因素被迫维持复杂的双货币安排。"
    confidence_before_research: medium

  - id: H3
    statement: "澳门的双货币现象主要是行业和交易网络分工的结果：港币服务旅游、博彩、跨境消费和部分资产交易，澳门元服务本地工资、税费、社区零售和公共结算。"
    mechanism: "不同部门面对不同的客户、供应商和结算网络；只要游客和跨境交易持续带来港币需求，商户就有动力接受港币，而本地工资、政府收费和居民日常账户又会维持澳门元的网络效应。"
    predictions:
      - "港币接受率在赌场、酒店、旅游零售、出租车和口岸附近高于居民社区和本地公共服务。"
      - "澳门元更常用于本地工资、税费、房租、公共缴费和社区消费，港币更常用于游客和跨境交易。"
      - "商户接受港币的主要原因是客户结构和结算网络，而不一定是居民对澳门元缺乏信任。"
      - "当旅游流量、博彩收入或跨境政策变化时，港币在相关行业的可见度和使用比例会变化。"
    evidence_needed:
      - "按行业、地区和客户类型统计的港币接受率、交易量和找零货币。"
      - "赌场、酒店、零售、交通、银行和公共部门的结算货币及收银规则。"
      - "游客、居民、跨境劳动者和企业的支付行为与货币持有数据。"
      - "旅游、博彩和跨境流量变化前后的双货币使用变化。"
    falsifiers:
      - "港币在居民社区、本地工资、税费和公共服务中与旅游行业一样普遍。"
      - "行业之间没有稳定的货币分工，港币使用主要由统一的居民偏好决定。"
      - "旅游和跨境交易变化对港币使用比例没有可观察影响。"
    confidence_before_research: medium

  - id: H4
    statement: "澳门元的保留具有历史路径依赖和政治制度意义；本地货币不仅是支付工具，也标记了澳门作为独立行政和金融管理单位的边界。"
    mechanism: "一旦本地货币被纳入法律、行政、银行、商业合同和社会认同，完全改用港币就不只是换钞，而是重新定义制度边界和历史连续性；既有安排会通过习惯、文件和组织利益自我延续。"
    predictions:
      - "澳门元的发行、纸币设计、公共叙事或法律地位被赋予超出支付便利的本地象征意义。"
      - "政权交接、货币制度调整或金融监管变化时，澳门元的保留成为明确的制度议题。"
      - "即使港币在部分场景更方便，本地机构仍会维护澳门元的名称、单位和制度连续性。"
      - "居民对澳门元的态度会受到世代、身份认同和对本地制度信任的影响，而不完全由汇率和手续费决定。"
    evidence_needed:
      - "澳门元出现、发行和制度调整的历史文件。"
      - "1999年前后关于货币地位、金融管理和制度连续性的官方文件与立法记录。"
      - "纸币设计、公共宣传、学校教育和媒体中对澳门元的制度与身份表述。"
      - "不同世代和不同社会群体对澳门元、港币及正式港币化的态度调查。"
    falsifiers:
      - "历史文件显示澳门元的保留完全由短期技术或商业成本决定，没有制度连续性因素。"
      - "居民和机构对澳门元没有任何认同或制度偏好，且在制度改变时只按价格和便利做选择。"
      - "澳门元在法律和公共叙事中没有独立地位，只是港币的可替代记账符号。"
    confidence_before_research: low

  - id: H5
    statement: "‘澳门老百姓不直接按照港币储蓄、投资和使用’这一前提可能不成立；居民可能在日常支付使用澳门元，在储蓄、跨境消费或投资中使用港币，形成按场景分工的货币组合。"
    mechanism: "居民不是在澳门元和港币之间做一次性制度选择，而是在收入、支出、存款、负债和资产配置之间进行多次选择；跨境联系、金融产品供给、利率、兑换成本和家庭经验会造成显著差异。"
    predictions:
      - "居民的日常消费货币与银行存款、投资产品和跨境资产的货币并不完全相同。"
      - "有香港收入、香港银行账户、跨境家庭或港币资产的人更可能持有和投资港币。"
      - "只观察商户收银不能推断居民的储蓄和投资货币，家庭和企业之间也会存在差异。"
      - "居民选择港币或澳门元会随资产类别、期限、利率、费用和未来支出地点变化。"
    evidence_needed:
      - "居民按货币划分的现金、存款、贷款、保险、基金、股票和房产负债数据。"
      - "不同收入、年龄、职业和跨境联系群体的家庭金融调查。"
      - "银行与金融机构提供的澳门元、港币和其他货币产品、利率和费用。"
      - "居民对货币安全、收益、流动性、身份和跨境支付便利的访谈。"
    falsifiers:
      - "居民在收入、日常消费、存款和投资中几乎全部使用澳门元，港币只由游客和少数企业使用。"
      - "居民即使拥有跨境联系和港币金融渠道，也没有更高的港币持有或投资比例。"
      - "不同资产类别和社会群体之间不存在可识别的货币组合差异。"
    confidence_before_research: medium
